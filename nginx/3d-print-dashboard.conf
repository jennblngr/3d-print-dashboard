# Site config for 3d-print-dashboard.jennblngr.com, to install on the VPS's existing
# host nginx (this VPS also serves other sites, so the project ships no reverse proxy
# of its own, see docker-compose.yml).
#
# Install:
#   sudo cp nginx/3d-print-dashboard.conf /etc/nginx/sites-available/3d-print-dashboard.jennblngr.com
#   sudo ln -s /etc/nginx/sites-available/3d-print-dashboard.jennblngr.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d 3d-print-dashboard.jennblngr.com
# certbot rewrites the installed file in place to add the certificate/SSL directives
# and an HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name 3d-print-dashboard.jennblngr.com;

    # The app only exchanges small JSON messages.
    client_max_body_size 200k;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The app rate-limits per visitor from the last address in this header.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

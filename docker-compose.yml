services:
  app:
    build: .
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?missing from .env - see README}
      SECURE_COOKIES: "true"
      TRUST_PROXY: "true"
    # Reachable from the server itself only: the host's nginx forwards the public traffic here.
    ports:
      - "127.0.0.1:3020:3000"
    volumes:
      - data:/data

volumes:
  data:
